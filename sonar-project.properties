# SonarQube Community Build running locally
sonar.host.url=http://localhost:9000

sonar.projectKey=jadli-nodejs
sonar.projectName=Inventory & Orders API (Node.js)
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.exclusions=node_modules/**,coverage/**
sonar.sourceEncoding=UTF-8

# Coverage produced by `npm test` (Jest, lcov format)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.js

# The authentication token is NOT stored here.
# Pass it on the command line (-Dsonar.token=...) or through the SONAR_TOKEN environment variable.
